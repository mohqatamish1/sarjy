[project]
name = "sarjy-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "sqlalchemy>=2.0.48,<3",
  "psycopg[binary]>=3.3,<4", "alembic>=1.18,<2", "pydantic-settings>=2.13,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.22,<1",
]
[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
